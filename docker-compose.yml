services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safetrip
      POSTGRES_PASSWORD: safetrip
      POSTGRES_DB: safetrip
    ports:
      - "5432:5432"
    volumes:
      - safetrip_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetrip -d safetrip"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  safetrip_pg:
